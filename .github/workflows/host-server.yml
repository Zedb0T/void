name: Host Game Server

on:
  workflow_dispatch:
    inputs:
      server_name:
        description: 'Server name displayed in-game'
        required: false
        default: 'Void'
      max_players:
        description: 'Maximum number of players'
        required: false
        default: '2048'
      bot_count:
        description: 'Number of AI bots to spawn'
        required: false
        default: '100'
      xp_rate:
        description: 'Experience rate multiplier'
        required: false
        default: '1000000.0'
      timeout_hours:
        description: 'How many hours to keep the server running (max 6)'
        required: false
        default: '6'

jobs:
  host:
    name: Run Game Server
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Create folders
        run: mkdir -p data/cache/ data/saves/

      - name: Grant permissions to gradlew
        run: chmod +x gradlew

      - name: Restore game cache from GitHub Actions cache
        id: cache-files
        uses: actions/cache@v3
        with:
          key: game-cache-v1
          path: data/cache/

      - name: Download game cache from GitHub Release
        if: steps.cache-files.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "⬇️ Downloading game cache from GitHub Release..."
          gh release download game-cache --pattern "game-cache.zip" --dir .
          unzip -o game-cache.zip -d data/cache/
          rm game-cache.zip
          echo "✅ Game cache extracted"

      - name: Verify cache files exist
        run: |
          if [ -f "data/cache/main_file_cache.idx255" ] && [ -f "data/cache/main_file_cache.dat2" ]; then
            echo "✅ Game cache files found"
          else
            echo "❌ Game cache files missing - server cannot start without them"
            exit 1
          fi

      - name: Restore player saves
        id: restore-saves
        uses: actions/cache/restore@v3
        with:
          key: player-saves-${{ github.run_id }}
          restore-keys: |
            player-saves-
          path: data/saves/

      - name: Show restored saves
        run: |
          SAVE_COUNT=$(find data/saves/ -name "*.json" 2>/dev/null | wc -l)
          echo "📂 Restored $SAVE_COUNT player save file(s)"

      - name: Build server JAR
        run: ./gradlew shadowJar
        env:
          GRADLE_OPTS: -Xmx4g -Xms1g

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: Start cloudflared TCP tunnel
        run: |
          cloudflared tunnel --url tcp://localhost:43594 --no-autoupdate > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

          # Wait for the tunnel URL to appear in logs (up to 60 seconds)
          echo "⏳ Waiting for cloudflared tunnel to establish..."
          TUNNEL_URL=""
          for i in $(seq 1 60); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.trycloudflare\.com' cloudflared.log 2>/dev/null | head -1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "⚠️ Could not extract tunnel URL after 60s. Full log:"
            cat cloudflared.log
          else
            echo "🌐 Cloudflare Tunnel URL: $TUNNEL_URL"
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          fi

      - name: Start game server
        env:
          server.name: ${{ github.event.inputs.server_name }}
          world.players.max: ${{ github.event.inputs.max_players }}
          bots.count: ${{ github.event.inputs.bot_count }}
          world.experienceRate: ${{ github.event.inputs.xp_rate }}
          storage.type: files
          server.live: 'false'
          development.accountCreation: 'true'
        run: |
          echo "============================================"
          echo "  🎮 Starting Void Game Server"
          echo "============================================"
          echo "  Server Name: ${{ github.event.inputs.server_name }}"
          echo "  Max Players: ${{ github.event.inputs.max_players }}"
          echo "  Bot Count:   ${{ github.event.inputs.bot_count }}"
          echo "  XP Rate:     ${{ github.event.inputs.xp_rate }}"
          echo "  Tunnel URL:  ${TUNNEL_URL:-'(pending)'}"
          echo "============================================"
          echo ""
          echo "📋 Players connect using the cloudflared tunnel."
          echo "   On the client machine, run:"
          echo "   cloudflared access tcp --hostname <TUNNEL_URL> --url localhost:43594"
          echo ""
          echo "   Then connect the game client to localhost:43594"
          echo "============================================"

          # Find the built JAR
          JAR_FILE=$(find game/build/libs -name "void-server-*.jar" ! -name "*-sources*" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ Could not find server JAR"
            exit 1
          fi
          echo "Using JAR: $JAR_FILE"

          # Run the server - this blocks until the workflow times out or is cancelled
          java -Xmx4g -Xms1g -jar "$JAR_FILE"

      - name: Save player data
        if: always()
        uses: actions/cache/save@v3
        with:
          key: player-saves-${{ github.run_id }}
          path: data/saves/

      - name: Cleanup
        if: always()
        run: |
          if [ -f cloudflared.pid ]; then
            kill $(cat cloudflared.pid) 2>/dev/null || true
          fi
          echo "✅ Player saves cached. Server stopped."
