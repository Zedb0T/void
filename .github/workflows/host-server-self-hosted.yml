name: Host Game Server (Self-Hosted Runner)

on:
  workflow_dispatch:
    inputs:
      server_name:
        description: 'Server name displayed in-game'
        required: false
        default: 'Void'
      max_players:
        description: 'Maximum number of players'
        required: false
        default: '2048'
      bot_count:
        description: 'Number of AI bots to spawn'
        required: false
        default: '30000'
      xp_rate:
        description: 'Experience rate multiplier'
        required: false
        default: '1000000.0'
      use_tunnel:
        description: 'Use cloudflared tunnel (true) or direct port access (false)'
        required: false
        default: 'false'

jobs:
  host:
    name: Run Game Server
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Create cache folder
        run: mkdir -p data/cache/

      - name: Grant permissions to gradlew
        run: chmod +x gradlew

      - name: Get cache version
        run: echo "cache_version=$(./gradlew -q printCacheVersion | tail -n1 | xargs)" >> $GITHUB_ENV

      - name: Check if AWS secrets exist
        id: check_secret
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore game cache files
        id: cache-files
        uses: actions/cache@v3
        with:
          key: cache-${{ env.cache_version }}-${{ hashFiles('data/cache/main_file_cache.idx255') }}
          path: data/cache/
          enableCrossOsArchive: 'true'
          restore-keys: |
            cache-${{ env.cache_version }}
            cache-

      - name: Download game cache files from S3
        if: steps.check_secret.outputs.exists == 'true' && steps.cache-files.outputs.cache-hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-2
        run: aws s3 cp --recursive s3://void-rsps/caches/${{ env.cache_version }}/ data/cache/

      - name: Verify cache files exist
        run: |
          if [ -f "data/cache/main_file_cache.idx255" ] && [ -f "data/cache/main_file_cache.dat2" ]; then
            echo "✅ Game cache files found"
          else
            echo "❌ Game cache files missing - server cannot start without them"
            exit 1
          fi

      - name: Build server JAR
        run: ./gradlew shadowJar
        env:
          GRADLE_OPTS: -Xmx4g -Xms1g

      - name: Start cloudflared TCP tunnel
        if: ${{ github.event.inputs.use_tunnel == 'true' }}
        run: |
          # Install cloudflared if not already present
          if ! command -v cloudflared &> /dev/null; then
            curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
            sudo dpkg -i cloudflared.deb
            rm cloudflared.deb
          fi

          cloudflared tunnel --url tcp://localhost:43594 --no-autoupdate > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

          echo "⏳ Waiting for cloudflared tunnel to establish..."
          for i in $(seq 1 30); do
            if grep -q "trycloudflare.com" cloudflared.log 2>/dev/null; then
              break
            fi
            sleep 2
          done

          TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cloudflared.log | head -1 || true)
          if [ -n "$TUNNEL_URL" ]; then
            echo "🌐 Cloudflare Tunnel URL: $TUNNEL_URL"
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          else
            echo "⚠️ Could not extract tunnel URL"
            cat cloudflared.log
          fi

      - name: Start game server
        env:
          server.name: ${{ github.event.inputs.server_name }}
          world.players.max: ${{ github.event.inputs.max_players }}
          bots.count: ${{ github.event.inputs.bot_count }}
          world.experienceRate: ${{ github.event.inputs.xp_rate }}
          storage.type: files
          development.accountCreation: 'true'
        run: |
          echo "============================================"
          echo "  🎮 Starting Void Game Server"
          echo "============================================"
          echo "  Server Name: ${{ github.event.inputs.server_name }}"
          echo "  Max Players: ${{ github.event.inputs.max_players }}"
          echo "  Bot Count:   ${{ github.event.inputs.bot_count }}"
          echo "  XP Rate:     ${{ github.event.inputs.xp_rate }}"
          if [ "${{ github.event.inputs.use_tunnel }}" = "true" ]; then
            echo "  Tunnel URL:  ${TUNNEL_URL:-'(pending)'}"
            echo "============================================"
            echo ""
            echo "📋 To connect via tunnel, on the client machine run:"
            echo "   cloudflared access tcp --hostname <TUNNEL_URL> --url localhost:43594"
            echo "   Then connect the game client to localhost:43594"
          else
            echo "  Port:        43594 (direct access)"
            echo "============================================"
            echo ""
            echo "📋 Connect the game client directly to this machine's IP on port 43594"
          fi
          echo "============================================"

          JAR_FILE=$(find game/build/libs -name "void-server-*.jar" ! -name "*-sources*" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ Could not find server JAR"
            exit 1
          fi
          echo "Using JAR: $JAR_FILE"

          java -Xmx4g -Xms1g -jar "$JAR_FILE"

      - name: Cleanup
        if: always()
        run: |
          if [ -f cloudflared.pid ]; then
            kill $(cat cloudflared.pid) 2>/dev/null || true
          fi
          echo "Server stopped."
